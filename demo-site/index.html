<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Intent Demo Site</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#top" aria-label="Dexter demo home">HOME</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#archive">ARCHIVE</a>
        <a href="#about">ABOUT</a>
        <a href="#contact">CONTACT</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" id="overview" aria-labelledby="hero-title">
        <div class="hero-title-wrap">
          <h1 id="hero-title" aria-label="DEXTER">
            <span>DEXTER</span>
            <span aria-hidden="true">DEXTER</span>
            <span aria-hidden="true">DEXTER</span>
          </h1>
        </div>

        <div class="hero-image" id="visual" aria-label="Center image supplied for the demo">
          <img src="assets/dexter-center-image.jpeg" alt="People sitting on a boat near the water">
        </div>

        <p class="corner-label corner-left">WANGXINYI</p>
        <nav class="corner-label corner-right" aria-label="Section index">
          <a href="#top">1</a>
          <a href="#archive">2</a>
          <a href="#about">3</a>
          <a href="#contact">4</a>
        </nav>
      </section>

      <section class="archive" id="archive" aria-labelledby="archive-title">
        <div class="archive-heading">
          <p>ARCHIVE / 02 INDEX</p>
          <h2 id="archive-title">Archive</h2>
        </div>

        <div class="archive-stack" aria-label="Archive categories">
          <a class="archive-card archive-card-red archive-card-wide" href="#archive">
            <span class="archive-number">01</span>
            <span class="archive-name">motion</span>
          </a>
          <a class="archive-card archive-card-ink archive-card-right" href="#archive">
            <span class="archive-number">02</span>
            <span class="archive-name">branding</span>
          </a>
          <a class="archive-card archive-card-light archive-card-left" href="#archive">
            <span class="archive-number">03</span>
            <span class="archive-name">editorial</span>
          </a>
          <a class="archive-card archive-card-mid archive-card-right archive-card-deep" href="#archive">
            <span class="archive-number">04</span>
            <span class="archive-name">photoworks</span>
          </a>
          <a class="archive-card archive-card-red archive-card-left archive-card-low" href="#archive">
            <span class="archive-number">05</span>
            <span class="archive-name">identity</span>
          </a>
          <a class="archive-card archive-card-light archive-card-right archive-card-lowest" href="#archive">
            <span class="archive-number">06</span>
            <span class="archive-name">process</span>
          </a>
        </div>
      </section>
      <section class="notes" id="about" aria-label="About placeholder"></section>
      <section class="notes" id="contact" aria-label="Contact placeholder"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
